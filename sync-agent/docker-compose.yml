# Portainer stack for the printokay sync-agent (Synology NAS).
#
# Deploy: Portainer → Stacks → Add stack → Git repository
#   Repo + compose path: sync-agent/docker-compose.yml
# Set the environment variables below in Portainer's stack UI (not in git).
#
# Bambuddy runs in `network_mode: host`, so we run the sidecar in host mode too
# and reach Bambuddy at 127.0.0.1 on its port (default 8109). The sidecar only
# makes outbound connections, so host mode is safe. No ports are published.

services:
  sync-agent:
    build: .
    restart: unless-stopped
    network_mode: host
    environment:
      BAMBUDDY_URL: ${BAMBUDDY_URL:-http://127.0.0.1:8109}
      BAMBUDDY_API_KEY: ${BAMBUDDY_API_KEY}
      SHOP_URL: ${SHOP_URL}
      SHOP_SYNC_TOKEN: ${SHOP_SYNC_TOKEN}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-600}
      # Bambuddy paths — confirmed against the instance's openapi.json. Override only if upgraded.
      BAMBUDDY_SPOOLS_PATH: ${BAMBUDDY_SPOOLS_PATH:-/api/v1/inventory/spools}
      BAMBUDDY_UPLOAD_PATH: ${BAMBUDDY_UPLOAD_PATH:-/api/v1/library/files}
      BAMBUDDY_FILES_PATH: ${BAMBUDDY_FILES_PATH:-/api/v1/library/files}
      BAMBUDDY_UPLOAD_FIELD: ${BAMBUDDY_UPLOAD_FIELD:-file}
      FALLBACK_COST_PER_KG_ORE: ${FALLBACK_COST_PER_KG_ORE:-0}
