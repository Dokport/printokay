# Portainer stack for the printokay sync-agent (Synology NAS, same Docker as Bambuddy).
#
# Deploy: Portainer → Stacks → Add stack → Git repository
#   Repo + compose path: sync-agent/docker-compose.yml
# Set the environment variables below in Portainer's stack UI (not in git).
#
# The agent joins Bambuddy's existing Docker network and reaches it by container
# name — most reliable on Synology. You need three values (find them in Portainer):
#   - BAMBUDDY_NETWORK : Bambuddy container → Network name
#   - BAMBUDDY_URL     : http://<bambuddy-container-name>:<INTERNAL port>
#                        (internal port is the right-hand side of e.g. 8109:8000 → 8000)

services:
  sync-agent:
    build: .
    restart: unless-stopped
    environment:
      BAMBUDDY_URL: ${BAMBUDDY_URL}
      BAMBUDDY_API_KEY: ${BAMBUDDY_API_KEY}
      SHOP_URL: ${SHOP_URL}
      SHOP_SYNC_TOKEN: ${SHOP_SYNC_TOKEN}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-600}
      # Bambuddy paths — confirmed against the instance's openapi.json. Override only if upgraded.
      BAMBUDDY_SPOOLS_PATH: ${BAMBUDDY_SPOOLS_PATH:-/api/v1/inventory/spools}
      BAMBUDDY_UPLOAD_PATH: ${BAMBUDDY_UPLOAD_PATH:-/api/v1/library/files}
      BAMBUDDY_FILES_PATH: ${BAMBUDDY_FILES_PATH:-/api/v1/library/files}
      BAMBUDDY_UPLOAD_FIELD: ${BAMBUDDY_UPLOAD_FIELD:-file}
      FALLBACK_COST_PER_KG_ORE: ${FALLBACK_COST_PER_KG_ORE:-0}
    networks:
      - bambuddy

# Bambuddy's existing network, joined by name (set BAMBUDDY_NETWORK in Portainer).
networks:
  bambuddy:
    external: true
    name: ${BAMBUDDY_NETWORK}
