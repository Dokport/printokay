# Portainer stack for the printokay sync-agent (Synology NAS).
#
# Koden ligger som en volume-mount på NAS'en — ingen Docker-build.
# Opdatering af sidecar:
#   1. Kopiér ny index.js til /volume2/docker_ssd/printokay-sync/ på NAS'en
#      (SSH: wget -O /volume2/docker_ssd/printokay-sync/index.js \
#        https://raw.githubusercontent.com/Dokport/printokay/main/sync-agent/index.js)
#   2. Portainer → Containers → printokay-sync → Restart

services:
  sync-agent:
    image: node:20-alpine
    container_name: printokay-sync
    restart: unless-stopped
    network_mode: host
    working_dir: /app
    volumes:
      - /volume2/docker_ssd/printokay-sync:/app:ro
    command: ["node", "index.js"]
    environment:
      # ── Required ────────────────────────────────────────────────────────────
      BAMBUDDY_URL: "http://127.0.0.1:8109"
      BAMBUDDY_API_KEY: "SKIFT_MIG"
      SHOP_URL: "https://www.printokay.dk"
      SHOP_SYNC_TOKEN: "SKIFT_MIG"

      # ── Optional ────────────────────────────────────────────────────────────
      SYNC_INTERVAL: "600"

      # Standard-printer til "send til print" fra admin (find id i Bambuddy → Printers).
      DEFAULT_PRINTER_ID: ""

      # Bambuddy library-mappe alle produkter lægges under.
      BAMBUDDY_ROOT_FOLDER: "printOKAY"

      # archive.cost er i kr → øre (×100). Ændr kun hvis Bambuddy gemmer øre direkte.
      BAMBUDDY_COST_TO_OERE: "100"

      # Materialepris-fallback i øre/kg (bruges hvis ingen spole har en pris). 0 = spring over.
      FALLBACK_COST_PER_KG_ORE: "0"

      # ── Bambuddy API-stier (ret kun hvis Bambuddy skifter paths) ────────────
      BAMBUDDY_SPOOLS_PATH: "/api/v1/inventory/spools"
      BAMBUDDY_UPLOAD_PATH: "/api/v1/library/files"
      BAMBUDDY_FILES_PATH: "/api/v1/library/files"
      BAMBUDDY_FOLDERS_PATH: "/api/v1/library/folders/"
      BAMBUDDY_PROJECTS_PATH: "/api/v1/projects/"
      BAMBUDDY_PRINTERS_PATH: "/api/v1/printers/"
      BAMBUDDY_ARCHIVES_PATH: "/api/v1/archives/"
      BAMBUDDY_UPLOAD_FIELD: "file"
